name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: Build, Lint, Test & Benchmark Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain & wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: |
          if ! cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1; then
            cat clippy.log
            ERR_MSG=$(tail -n 30 clippy.log | tr '\r\n' '  ')
            echo "::error::$ERR_MSG"
            exit 1
          fi
          cat clippy.log

      - name: Run workspace unit & P2P integration tests
        run: |
          if ! cargo test --workspace > test.log 2>&1; then
            cat test.log
            ERR_MSG=$(tail -n 30 test.log | tr '\r\n' '  ')
            echo "::error::$ERR_MSG"
            exit 1
          fi
          cat test.log

      - name: Build wasm32-wasip1 job kernels
        run: |
          cargo build --manifest-path jobs/word-count/Cargo.toml --target wasm32-wasip1 --release
          cargo build --manifest-path jobs/pattern-match/Cargo.toml --target wasm32-wasip1 --release
          cargo build --manifest-path jobs/kv-wordcount/Cargo.toml --target wasm32-wasip1 --release
          ls -lh target/wasm32-wasip1/release/*.wasm

      - name: Build workspace in release mode
        run: |
          if ! cargo build --release > build.log 2>&1; then
            cat build.log
            ERR_MSG=$(tail -n 30 build.log | tr '\r\n' '  ')
            echo "::error::$ERR_MSG"
            exit 1
          fi
          cat build.log

      - name: Run sandbox latency & throughput benchmark
        run: cargo run -p core --example bench_sandbox --release
