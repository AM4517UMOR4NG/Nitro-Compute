<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%">
  <defs>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#8B949E" />
    </marker>
    <marker id="seqArrowOpen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#8B949E" stroke-width="1.6" />
    </marker>
    <marker id="seqCross" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 2 2 L 10 10 M 10 2 L 2 10" fill="none" stroke="#F85149" stroke-width="2" />
    </marker>
  </defs>

  <!-- GitHub Native Dark Canvas -->
  <rect width="1080" height="720" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />

  <!-- ===================================================================== -->
  <!-- TOP PARTICIPANT BOXES (Mermaid Sequence Diagram Style)                -->
  <!-- ===================================================================== -->
  <!-- Participant 1: Input Stream -->
  <rect x="40" y="28" width="150" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="115" y="49" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Input Data Stream</text>
  <text x="115" y="65" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">input.txt</text>

  <!-- Participant 2: Computer A (Coordinator) -->
  <rect x="240" y="28" width="180" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="330" y="49" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Computer A: Coordinator</text>
  <text x="330" y="65" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">coordinator/src/main.rs</text>

  <!-- Participant 3: Decentralized P2P Mesh -->
  <rect x="470" y="28" width="190" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="565" y="49" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Decentralized P2P Mesh</text>
  <text x="565" y="65" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">Kademlia DHT + Gossipsub</text>

  <!-- Participant 4: Computer B (Worker Node) -->
  <rect x="710" y="28" width="165" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="792" y="49" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Computer B: Worker</text>
  <text x="792" y="65" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">worker/src/main.rs</text>

  <!-- Participant 5: Wasmtime Sandbox -->
  <rect x="910" y="28" width="135" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="977" y="49" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Wasmtime Sandbox</text>
  <text x="977" y="65" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">Cranelift (&lt;1ms)</text>

  <!-- ===================================================================== -->
  <!-- VERTICAL LIFELINES                                                    -->
  <!-- ===================================================================== -->
  <line x1="115" y1="76" x2="115" y2="640" stroke="#30363D" stroke-width="1.5" />
  <line x1="330" y1="76" x2="330" y2="640" stroke="#30363D" stroke-width="1.5" />
  <line x1="565" y1="76" x2="565" y2="640" stroke="#30363D" stroke-width="1.5" />
  <line x1="792" y1="76" x2="792" y2="640" stroke="#30363D" stroke-width="1.5" />
  <line x1="977" y1="76" x2="977" y2="640" stroke="#30363D" stroke-width="1.5" />

  <!-- ===================================================================== -->
  <!-- STEP 1: Ingest Data Stream                                            -->
  <!-- ===================================================================== -->
  <line x1="330" y1="114" x2="121" y2="114" stroke="#8B949E" stroke-width="1.5" marker-end="url(#seqArrow)" />
  <circle cx="330" cy="114" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="330" y="118" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">1</text>
  <text x="222" y="106" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Ingest &amp; fragment file into chunks</text>

  <!-- ===================================================================== -->
  <!-- STEP 2: Load jobs/word-count.wasm (Self-Call)                         -->
  <!-- ===================================================================== -->
  <path d="M 330 142 L 372 142 L 372 168 L 336 168" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#seqArrow)" />
  <circle cx="330" cy="142" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="330" y="146" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">2</text>
  <text x="382" y="159" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Load compiled jobs/word_count.wasm</text>

  <!-- ===================================================================== -->
  <!-- LOOP FRAME: MapReduce Task Dispatch & Execution                       -->
  <!-- ===================================================================== -->
  <rect x="215" y="190" width="830" height="428" fill="#161B22" fill-opacity="0.25" stroke="#30363D" stroke-width="1.5" />
  <polygon points="215,190 270,190 270,204 260,214 215,214" fill="#21262D" stroke="#30363D" stroke-width="1.5" />
  <text x="242" y="206" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">loop</text>
  <text x="282" y="206" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">[For each fragmented data_chunk in stream]</text>

  <!-- STEP 3: Pack & Broadcast TaskPayload to "task-alloc" -->
  <line x1="330" y1="246" x2="559" y2="246" stroke="#8B949E" stroke-width="1.5" marker-end="url(#seqArrow)" />
  <circle cx="330" cy="246" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="330" y="250" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">3</text>
  <text x="447" y="237" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Phase 5: Publish TaskPayload to "task-alloc"</text>

  <!-- Note box over P2P Mesh -->
  <rect x="465" y="258" width="200" height="32" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
  <text x="565" y="278" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">TCP + Noise + Yamux + DHT</text>

  <!-- STEP 4: Deliver & Decode TaskPayload at Worker -->
  <line x1="565" y1="312" x2="786" y2="312" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seqArrowOpen)" />
  <circle cx="565" cy="312" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="565" y="316" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">4</text>
  <text x="678" y="303" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Intercept &amp; decode TaskPayload</text>

  <!-- STEP 5 & 6: Boot Sandbox & Inject Fuel Metering -->
  <line x1="792" y1="352" x2="971" y2="352" stroke="#8B949E" stroke-width="1.5" marker-end="url(#seqArrow)" />
  <circle cx="792" cy="352" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="792" y="356" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">5</text>
  <text x="884" y="343" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Boot WASI Store &amp; add_fuel()</text>

  <line x1="792" y1="388" x2="971" y2="388" stroke="#8B949E" stroke-width="1.5" marker-end="url(#seqArrow)" />
  <circle cx="792" cy="388" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="792" y="392" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">6</text>
  <text x="884" y="379" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Inject chunk into linear memory</text>

  <!-- ===================================================================== -->
  <!-- ALT FRAME: Fuel Metering Verification                                 -->
  <!-- ===================================================================== -->
  <rect x="235" y="408" width="790" height="196" fill="#0D1117" fill-opacity="0.55" stroke="#30363D" stroke-width="1.4" />
  <polygon points="235,408 282,408 282,422 272,432 235,432" fill="#21262D" stroke="#30363D" stroke-width="1.4" />
  <text x="258" y="424" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">alt</text>
  <text x="294" y="424" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">[Within Fuel Budget — Safe Execution]</text>

  <!-- Safe execution return: Sandbox -> Worker -->
  <line x1="977" y1="454" x2="798" y2="454" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seqArrowOpen)" />
  <circle cx="977" cy="454" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="977" y="458" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">7</text>
  <text x="884" y="445" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">map_line(ptr, len) -&gt; word_count</text>

  <!-- STEP 8: Worker publishes ResultPayload to "task-results" -->
  <line x1="792" y1="488" x2="571" y2="488" stroke="#8B949E" stroke-width="1.5" marker-end="url(#seqArrow)" />
  <circle cx="792" cy="488" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="792" y="492" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">8</text>
  <text x="681" y="479" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Phase 6: Publish ResultPayload to "task-results"</text>

  <!-- STEP 9: Mesh delivers ResultPayload back to Coordinator -->
  <line x1="565" y1="522" x2="336" y2="522" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seqArrowOpen)" />
  <circle cx="565" cy="522" r="9.5" fill="#21262D" stroke="#8B949E" stroke-width="1.2" />
  <text x="565" y="526" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">9</text>
  <text x="447" y="513" text-anchor="middle" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Deliver ResultPayload &amp; aggregate unified sum</text>

  <!-- Alt Divider: [Fuel Exhausted / Infinite Loop] -->
  <line x1="235" y1="544" x2="1025" y2="544" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4,4" />
  <text x="294" y="562" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">[Fuel Exhausted — Infinite Loop / DoS Attempt]</text>

  <!-- STEP 10: Trap::OutOfFuel aborts execution -->
  <line x1="977" y1="584" x2="800" y2="584" stroke="#F85149" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seqCross)" />
  <circle cx="977" cy="584" r="9.5" fill="#21262D" stroke="#F85149" stroke-width="1.2" />
  <text x="977" y="588" text-anchor="middle" fill="#F85149" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700">10</text>
  <text x="884" y="575" text-anchor="middle" fill="#FFA198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Trap::OutOfFuel -&gt; Abort safely</text>

  <!-- ===================================================================== -->
  <!-- BOTTOM PARTICIPANT BOXES (Mermaid Sequence Diagram Style)             -->
  <!-- ===================================================================== -->
  <rect x="40" y="640" width="150" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="115" y="661" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Input Data Stream</text>
  <text x="115" y="677" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">input.txt</text>

  <rect x="240" y="640" width="180" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="330" y="661" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Computer A: Coordinator</text>
  <text x="330" y="677" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">coordinator/src/main.rs</text>

  <rect x="470" y="640" width="190" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="565" y="661" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Decentralized P2P Mesh</text>
  <text x="565" y="677" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">Kademlia DHT + Gossipsub</text>

  <rect x="710" y="640" width="165" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="792" y="661" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Computer B: Worker</text>
  <text x="792" y="677" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">worker/src/main.rs</text>

  <rect x="910" y="640" width="135" height="48" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="977" y="661" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Wasmtime Sandbox</text>
  <text x="977" y="677" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5">Cranelift (&lt;1ms)</text>
</svg>
